[project]
name = "store-analytics"
version = "0.1.0"
description = "AI-powered analytics and monitoring for stores and restaurants."
requires-python = ">=3.11"
authors = [{ name = "Zaid" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
