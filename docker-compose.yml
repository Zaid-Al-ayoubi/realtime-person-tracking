version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: store_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d store_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://analytics:analytics@db:5432/store_analytics"
      DATABASE_URL_SYNC: "postgresql://analytics:analytics@db:5432/store_analytics"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./recordings:/app/recordings
      - ./face_db:/app/face_db
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://analytics:analytics@db:5432/store_analytics"
      DATABASE_URL_SYNC: "postgresql://analytics:analytics@db:5432/store_analytics"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./recordings:/app/recordings
      - ./face_db:/app/face_db
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
  redis_data:
